id = "azusachino.cappuccino-bridge"
name = "Cappuccino bridge"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Loopback bridge plugin for the Cappuccino phone client: agent list, pi transcripts, pane-line stream (no auth; tailnet/loopback is the boundary)"
platforms = ["macos", "linux"]

# Rust on purpose (owner language decision 2026-10-06): no JavaScript runtime
# prerequisite. This executable is a Herdr-managed plugin command and a
# separate loopback transport process; it is not loaded into Herdr or an agent.
# herdr-web-ui was studied as a design reference; this implementation is our own.

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["macos", "linux"]

# Startup hooks are one-shot, not supervised; the binary owns its detached
# server process and uses a PID record bound to the executable and start nonce.
[[startup]]
command = ["target/release/cappuccino-bridge", "start"]
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Start Cappuccino bridge"
contexts = ["workspace"]
command = ["target/release/cappuccino-bridge", "start"]
platforms = ["macos", "linux"]

[[actions]]
id = "stop"
title = "Stop Cappuccino bridge"
contexts = ["workspace"]
command = ["target/release/cappuccino-bridge", "stop"]
platforms = ["macos", "linux"]

[[actions]]
id = "status"
title = "Cappuccino bridge status"
contexts = ["workspace"]
command = ["target/release/cappuccino-bridge", "status"]
platforms = ["macos", "linux"]

[[actions]]
id = "logs"
title = "Cappuccino bridge log tail"
contexts = ["workspace"]
command = ["target/release/cappuccino-bridge", "logs"]
platforms = ["macos", "linux"]
