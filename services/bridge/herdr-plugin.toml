id = "azusachino.cappuccino-bridge"
name = "Cappuccino bridge"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Token-authed loopback bridge for the Cappuccino phone client: agent list, pi transcripts, pane-line stream"
platforms = ["macos", "linux"]

# Rust on purpose (owner language decision 2026-10-06): the plugin ships as a
# single statically-linked binary — no JS runtime prerequisite on the machine,
# one toolchain, and the herdr socket client (tokio UnixStream) needs nothing
# beyond the crate tree. herdr-web-ui was studied as a design reference for
# the plugin surface and pi-store validation; the implementation is our own.

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["macos", "linux"]

# herdr startup hooks are one-shot, not supervised: the script owns the
# process, is idempotent, and never restarts a bridge that already answers.
[[startup]]
command = ["sh", "scripts/bridge.sh", "start"]
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Start Cappuccino bridge"
contexts = ["workspace"]
command = ["sh", "scripts/bridge.sh", "start"]
platforms = ["macos", "linux"]

[[actions]]
id = "stop"
title = "Stop Cappuccino bridge"
contexts = ["workspace"]
command = ["sh", "scripts/bridge.sh", "stop"]
platforms = ["macos", "linux"]

[[actions]]
id = "status"
title = "Cappuccino bridge status"
contexts = ["workspace"]
command = ["sh", "scripts/bridge.sh", "status"]
platforms = ["macos", "linux"]
