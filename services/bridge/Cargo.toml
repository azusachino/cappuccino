[package]
name = "cappuccino-bridge"
version = "0.1.0"
edition = "2021"
description = "Cappuccino herdr plugin bridge: loopback API over the herdr socket (no auth; tailnet/loopback is the boundary)"

[[bin]]
name = "cappuccino-bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
tokio = { version = "1", features = ["io-util", "process"] }
tokio-tungstenite = { version = "0.29", default-features = false }

