name: Cappuccino
options:
  minimumXcodeGenVersion: 2.46.0
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CappuccinoCore:
    path: .
targets:
  Cappuccino:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CappuccinoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azusachino.cappuccino
        INFOPLIST_KEY_CFBundleDisplayName: Cappuccino
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  CappuccinoMac:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: CappuccinoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azusachino.cappuccino.mac
        INFOPLIST_KEY_CFBundleDisplayName: Cappuccino
  CappuccinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cappuccino
schemes:
  Cappuccino:
    build:
      targets:
        Cappuccino: all
    test:
      targets: [CappuccinoUITests]
  CappuccinoMac:
    build:
      targets:
        CappuccinoMac: all
