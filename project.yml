name: Cappuccino
options:
  minimumXcodeGenVersion: 2.46.0
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CappuccinoApple:
    path: packages/apple
targets:
  Cappuccino:
    type: application
    platform: iOS
    sources:
      - path: apps/ios
        excludes: [UITests]
    dependencies:
      - package: CappuccinoApple
        product: CappuccinoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azusachino.cappuccino
        INFOPLIST_KEY_CFBundleDisplayName: Cappuccino
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  CappuccinoMac:
    type: application
    platform: macOS
    sources: [apps/macos]
    dependencies:
      - package: CappuccinoApple
        product: CappuccinoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azusachino.cappuccino.mac
        INFOPLIST_KEY_CFBundleDisplayName: Cappuccino
  CappuccinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/ios/UITests]
    dependencies:
      - target: Cappuccino
schemes:
  Cappuccino:
    build:
      targets:
        Cappuccino: all
    test:
      targets: [CappuccinoUITests]
  CappuccinoMac:
    build:
      targets:
        CappuccinoMac: all
