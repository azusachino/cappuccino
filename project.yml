name: Cappuccino
configFiles:
  Debug: apps/ios/Config/Signing.xcconfig
  Release: apps/ios/Config/Signing.xcconfig
options:
  minimumXcodeGenVersion: 2.46.0
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
  deploymentTarget:
    iOS: "17.5"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CappuccinoApple:
    path: apps/ios
targets:
  CappuccinoPhone:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/App
      - path: apps/ios/Assets.xcassets
    dependencies:
      - package: CappuccinoApple
        product: CappuccinoUI
    settings:
      base:
        PRODUCT_NAME: Cappuccino
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.azusachino.cappuccino
        INFOPLIST_KEY_CFBundleDisplayName: Cappuccino
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the pairing QR code that cappuccino-bridge prints, to pair this iPhone with your Mac."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: apps/ios/App/Debug-Info.plist
  CappuccinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/ios/UITests]
    dependencies:
      - target: CappuccinoPhone
schemes:
  Cappuccino:
    build:
      targets:
        CappuccinoPhone: all
    test:
      targets: [CappuccinoUITests]
